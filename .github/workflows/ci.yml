name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v3
      - uses: pre-commit/action@v3.0.0

  pages:
    # every college / exam / career page renders against the real data, and
    # the site builds. A record that crashes its page fails here, not on a
    # student's screen.
    name: Pages render and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # the hand-kept CSVs: every change bumps a version, and no row or
      # column main has goes missing without docs/audits/data_changelog.csv
      # naming it
      - run: git fetch --depth=1 origin main
      - run: npm run check:data-versions -- --base FETCH_HEAD
      - run: npm run check:pages
      - run: npm run check:ids
      # predictor names linked to college cards (stars, NIRF, salary):
      # stale after a colleges.json or cutoff-data change
      - run: npm run check:name-links
      # every predictor name with its college card and AISHE code
      # (data-sources/predictor_college_crosswalk.csv): stale likewise
      - run: npm run check:crosswalk
      - run: npm run build
