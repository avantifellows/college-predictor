name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v3
      - uses: pre-commit/action@v3.0.0

  pages:
    # every college / exam / career page renders against the real data, and
    # the site builds. A record that crashes its page fails here, not on a
    # student's screen.
    name: Pages render and build
    runs-on: ubuntu-latest
    steps:
      # depth 2: a PR's merge commit and its first parent, the target
      # branch the PR is compared with
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # the hand-kept CSVs: every change bumps a version, and no row or
      # column the base has goes missing without docs/audits/data_changelog.csv
      # naming it. Base: the PR's target branch (HEAD^1 of the merge
      # commit); on a push, the commit before the push.
      - name: Data versions
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            BASE=HEAD^1
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git fetch --depth=1 origin "$BEFORE"
            BASE="$BEFORE"
          fi
          npm run check:data-versions -- ${BASE:+--base "$BASE"}
      - run: npm run check:pages
      - run: npm run check:ids
      # predictor names linked to college cards (stars, NIRF, salary):
      # stale after a colleges.json or cutoff-data change
      - run: npm run check:name-links
      # every predictor name with its college card and AISHE code
      # (data-sources/predictor_college_crosswalk.csv): stale likewise
      - run: npm run check:crosswalk
      - run: npm run build
